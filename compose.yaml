services:
  backend:
    build:
      context: ./backend
    environment:
      MEMORY_FIREWALL_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://127.0.0.1:8081}
      MEMORY_FIREWALL_COOKIE_SECURE: ${COOKIE_SECURE:-0}
      MEMORY_FIREWALL_RATE_LIMIT: "60"
      # Semantic verification. Empty by default: the firewall then runs purely
      # on its deterministic rules, which is a supported configuration.
      MEMORY_FIREWALL_LLM_API_KEY: ${MEMORY_FIREWALL_LLM_API_KEY:-}
      MEMORY_FIREWALL_LLM_MODEL: ${MEMORY_FIREWALL_LLM_MODEL:-nvidia/nemotron-3-nano-30b-a3b}
      MEMORY_FIREWALL_LLM_TIMEOUT: ${MEMORY_FIREWALL_LLM_TIMEOUT:-12}
      # Operator alerts for gated actions. Empty by default: the firewall
      # decides identically either way, it just stops narrating itself.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      TELEGRAM_TIMEOUT: ${TELEGRAM_TIMEOUT:-5}
    volumes:
      - firewall_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: caddy:2.10.2-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${PUBLIC_PORT:-8081}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped

volumes:
  firewall_data:
