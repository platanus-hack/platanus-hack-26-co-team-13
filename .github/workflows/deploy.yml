name: Test and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test backend
        working-directory: backend
        run: |
          python -m pip install ".[test]"
          MEMORY_FIREWALL_RATE_LIMIT=10 python -m pytest -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --ignore-scripts
          npm run build

  deploy:
    if: github.event_name != 'pull_request' && github.repository == 'rugelees/provenance-firewall'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy exact revision over restricted SSH
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key deploy@"$VPS_HOST" "deploy $GITHUB_SHA"
