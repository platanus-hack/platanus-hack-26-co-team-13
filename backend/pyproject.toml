[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-firewall"
version = "0.1.0"
description = "Signed cross-session provenance and fail-closed tool authorization for AI agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn>=0.29,<1.0",
  "pydantic>=2.6,<3.0",
  "cryptography>=44,<46",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[project.scripts]
memory-firewall = "memory_firewall.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["memory_firewall*", "api*", "analyzer*", "telegram_supervisor*"]

[tool.setuptools.package-data]
"memory_firewall" = ["action_contracts.json"]
"memory_firewall.adapters.pi" = ["*.ts", "*.json", "*.md"]
"memory_firewall.adapters.hermes" = ["*.yaml", "*.md"]
"memory_firewall.adapters.openclaw" = ["*.js", "*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
